name: bin-night CI

on:
  push:
    branches: ["**"]
    paths:
      - "bin-night/**"
      - ".github/workflows/bin-night-ci.yml"
  pull_request:
    paths:
      - "bin-night/**"
      - ".github/workflows/bin-night-ci.yml"
  workflow_dispatch:

jobs:
  core-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bin-night
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bin-night/**/*.gradle*', 'bin-night/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run core tests
        run: ./gradlew :core:test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: bin-night/core/build/reports/tests/test
