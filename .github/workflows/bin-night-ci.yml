name: bin-night CI

on:
  push:
    branches: ["**"]
    paths:
      - "bin-night/**"
      - ".github/workflows/bin-night-ci.yml"
  pull_request:
    paths:
      - "bin-night/**"
      - ".github/workflows/bin-night-ci.yml"
  workflow_dispatch:

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bin-night
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: node --test test/*.test.mjs
